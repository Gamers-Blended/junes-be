global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

scrape_configs:
  - job_name: "junes-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: [ "host.docker.internal:9404" ]
        labels:
          application: "junes-be"

  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]
